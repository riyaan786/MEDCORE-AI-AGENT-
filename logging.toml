[loggers]
keys = root, app

[handlers]
keys = console, file

[formatters]
keys = default

[formatter_default]
format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = default

[handler_file]
class = FileHandler
args = ("logs/medcore-ai.log", "a")
level = DEBUG
formatter = default

[logger_root]
level = WARNING
handlers = console

[logger_app]
level = DEBUG
handlers = console, file
qualname = app

