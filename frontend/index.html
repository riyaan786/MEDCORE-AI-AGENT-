<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedCore AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #2563eb;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 120px;
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
        }

        .assistant {
            align-self: flex-start;
            background: white;
            border: 1px solid #ddd;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            padding: 20px;
        }

        .input-container {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<header>
    <h1>MedCore AI</h1>
</header>

<div class="container">

    <div id="messages"></div>

</div>

<div class="input-area">

    <div class="input-container">

        <input
            id="messageInput"
            type="text"
            placeholder="Ask MedCore AI..."
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>

<script>

const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const messages = document.getElementById("messages");


function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    messages.appendChild(div);

    window.scrollTo(
        0,
        document.body.scrollHeight
    );
}


async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    button.disabled = true;

    try {

        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        addMessage(
            data.response,
            "assistant"
        );

    } catch (error) {

        console.error(error);

        addMessage(
            "Could not connect to MedCore AI.",
            "assistant"
        );

    } finally {

        button.disabled = false;

        input.focus();
    }
}


button.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);

</script>

</body>
</html>
